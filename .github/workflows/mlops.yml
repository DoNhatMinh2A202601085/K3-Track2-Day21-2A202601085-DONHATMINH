name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/mlops.yml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chạy unit tests trên dữ liệu ảo (không cần kết nối cloud storage).
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN (Bonus 1: Remote MLflow Tracking, Bonus 2: Multi-Algo, Bonus 5: Data Drift)
  # Huấn luyện mô hình, ghi nhận metrics và upload artifact lên Cloud (S3/GCS).
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      prev_accuracy: ${{ steps.read_prev_metrics.outputs.prev_accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage (AWS / GCP)
        run: |
          python - <<'EOF'
          import os, json

          cred_str = os.environ.get("CLOUD_CREDENTIALS", "").strip()
          if not cred_str:
              print("CLOUD_CREDENTIALS secret not found. Running in local data mode.")
              exit(0)

          try:
              data = json.loads(cred_str)
              # Kiem tra neu la AWS credentials JSON
              if "aws_access_key_id" in data or "AWS_ACCESS_KEY_ID" in data:
                  key_id = data.get("aws_access_key_id") or data.get("AWS_ACCESS_KEY_ID")
                  secret_key = data.get("aws_secret_access_key") or data.get("AWS_SECRET_ACCESS_KEY")
                  region = data.get("aws_region") or data.get("AWS_DEFAULT_REGION", "ap-southeast-1")
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write(f"AWS_ACCESS_KEY_ID={key_id}\n")
                      f.write(f"AWS_SECRET_ACCESS_KEY={secret_key}\n")
                      f.write(f"AWS_DEFAULT_REGION={region}\n")
                  print("Authenticated to AWS S3.")
              # Kiem tra neu la GCP Service Account Key JSON
              elif "private_key" in data or "type" in data:
                  with open("/tmp/sa-key.json", "w") as f:
                      f.write(cred_str)
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write("GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json\n")
                  print("Authenticated to GCP GCS.")
          except Exception as e:
              print(f"Warning parsing credentials: {e}")
          EOF
        env:
          CLOUD_CREDENTIALS: ${{ secrets.CLOUD_CREDENTIALS }}

      # Bonus 4: Doc metrics cua phien ban cu tu S3 de so sanh
      - name: Check previous model metrics from Cloud Storage
        id: read_prev_metrics
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os, json
          bucket_name = os.environ.get("CLOUD_BUCKET", "").strip()
          prev_acc = "0.0"
          if bucket_name and os.environ.get("AWS_ACCESS_KEY_ID"):
              try:
                  import boto3
                  s3 = boto3.client("s3")
                  s3.download_file(bucket_name, "models/latest/metrics.json", "/tmp/prev_metrics.json")
                  with open("/tmp/prev_metrics.json") as f:
                      prev_acc = str(json.load(f).get("accuracy", 0.0))
                  print(f"Previous model accuracy found on S3: {prev_acc}")
              except Exception as e:
                  print(f"No previous metrics found on S3 ({e}), default to 0.0")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"prev_accuracy={prev_acc}\n")
          EOF

      - name: Pull data with DVC
        run: |
          if [ -n "${{ secrets.CLOUD_BUCKET }}" ]; then
            dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc || python generate_data.py
          else
            echo "Cloud bucket not set. Generating dataset files locally..."
            python generate_data.py
          fi

      - name: Train model (Bonus 1, 2, 3, 5)
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model and metrics to Cloud Storage (AWS S3 / GCP GCS)
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          bucket_name = os.environ.get("CLOUD_BUCKET", "").strip()
          
          # 1. Thu upload len AWS S3
          if bucket_name and os.environ.get("AWS_ACCESS_KEY_ID"):
              try:
                  import boto3
                  s3 = boto3.client("s3")
                  s3.upload_file("models/model.pkl", bucket_name, "models/latest/model.pkl")
                  s3.upload_file("outputs/metrics.json", bucket_name, "models/latest/metrics.json")
                  print(f"Model and metrics successfully uploaded to S3: s3://{bucket_name}/models/latest/")
              except Exception as e:
                  print(f"S3 upload error: {e}")

          # 2. Thu upload len GCP GCS
          elif bucket_name and os.environ.get("GOOGLE_APPLICATION_CREDENTIALS"):
              try:
                  from google.cloud import storage
                  client = storage.Client()
                  bucket = client.bucket(bucket_name)
                  bucket.blob("models/latest/model.pkl").upload_from_filename("models/model.pkl")
                  bucket.blob("models/latest/metrics.json").upload_from_filename("outputs/metrics.json")
                  print(f"Model successfully uploaded to GCS: gs://{bucket_name}/models/latest/")
              except Exception as e:
                  print(f"GCS upload error: {e}")
          else:
              print("Local mode: Model saved to models/model.pkl and artifact.")
          EOF

      # Bonus 3: Luu tru ca metrics.json va report.txt trong GitHub Artifacts
      - name: Save metrics and performance report as artifacts (Bonus 3)
        uses: actions/upload-artifact@v4
        with:
          name: mlops-artifacts
          path: |
            outputs/metrics.json
            outputs/report.txt
            models/model.pkl


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL (Bonus 4: Rollback & Safety Compare with Previous Version)
  # Kiểm tra ngưỡng chất lượng mô hình (Eval Gate) và so sánh phiên bản cũ.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate and rollback safety (Bonus 4)
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          prev_acc = float("${{ needs.train.outputs.prev_accuracy }}")

          print("="*55)
          print(f"EVALUATION GATE & BONUS 4 SAFETY CHECK:")
          print(f"  - Do chinh xac model moi (New Accuracy) : {acc:.4f}")
          print(f"  - Do chinh xac model cu  (Prev Accuracy): {prev_acc:.4f}")
          print("="*55)

          # Kiem tra nguong toi thieu
          if acc < 0.65:
              raise SystemExit(f"FAILED: Accuracy {acc:.4f} < 0.65. Huy deploy de bao ve production!")

          # Bonus 4: So sanh voi phien ban truoc
          if prev_acc > 0.0 and acc < prev_acc:
              print(f"[CANH BAO / ROLLBACK] Model moi ({acc:.4f}) co accuracy thap hon model cu ({prev_acc:.4f})!")
          else:
              print(f"[AN TOAN] Model moi dat chat luong va san sang deploy len Production!")

          print("="*55)
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Triển khai mô hình lên Cloud VM (EC2 / GCE) qua SSH hoặc Smoke Test.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: mlops-artifacts

      - name: Deploy to Cloud VM / Smoke Test Inference API
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          CLEAN_HOST=$(echo "$VM_HOST" | tr -d '\r\n ' | sed -e 's|^https*://||' -e 's|/.*$||' -e 's|:.*$||')
          CLEAN_USER=$(echo "$VM_USER" | tr -d '\r\n ')

          if [ -n "$CLEAN_HOST" ] && [ -n "$CLEAN_USER" ] && [ -n "$VM_SSH_KEY" ]; then
            echo "Deploying to remote EC2 at '$CLEAN_HOST' via SSH..."
            mkdir -p ~/.ssh
            printf "%s\n" "$VM_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key

            # Wait for SSH port availability with retries
            for i in {1..10}; do
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i ~/.ssh/deploy_key $CLEAN_USER@$CLEAN_HOST "echo Connection established" && break || (echo "Retrying SSH connection in 5s..." && sleep 5)
            done

            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key $CLEAN_USER@$CLEAN_HOST "mkdir -p ~/src ~/models"
            scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key src/serve.py $CLEAN_USER@$CLEAN_HOST:~/src/serve.py
            scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key models/model.pkl $CLEAN_USER@$CLEAN_HOST:~/models/model.pkl || true
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key $CLEAN_USER@$CLEAN_HOST "sudo systemctl restart mlops-serve && sleep 5 && curl -sf http://localhost:8000/health && echo 'Deploy successfully!'"
          else
            echo "Running Local Inference Validation & Smoke Test on FastAPI..."
            mkdir -p ~/models
            cp -f models/model.pkl ~/models/model.pkl || true
            python -m uvicorn src.serve:app --host 0.0.0.0 --port 8000 &
            SERVER_PID=$!
            sleep 6
            echo "Checking /health endpoint..."
            curl -sf http://localhost:8000/health || (kill $SERVER_PID && exit 1)
            echo ""
            echo "Checking /predict endpoint with 12 features..."
            curl -sf -X POST http://localhost:8000/predict \
              -H "Content-Type: application/json" \
              -d '{"features": [7.4, 0.70, 0.00, 1.9, 0.076, 11.0, 34.0, 0.9978, 3.51, 0.56, 9.4, 0]}'
            echo ""
            echo "Smoke test passed successfully on FastAPI inference engine!"
            kill $SERVER_PID || true
          fi
